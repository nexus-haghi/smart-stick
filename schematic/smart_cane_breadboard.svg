      <circle cx="1170" cy="120" r="4" fill="#fbbf24"/><text x="1170" y="113" text-anchor="middle">TRIG</text>
      <circle cx="1240" cy="120" r="4" fill="#fbbf24"/><text x="1240" y="113" text-anchor="middle">ECHO</text>
      <circle cx="1310" cy="120" r="4" fill="#fbbf24"/><text x="1310" y="113" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- ================= BREADBOARD ================= -->
  <g>
    <rect x="620" y="180" width="580" height="420" rx="8" fill="#f7f3e8" stroke="#d6cfae" stroke-width="2"/>
    <rect x="620" y="346" width="580" height="26" fill="#e7dfc6"/>
    <rect x="628" y="190" width="564" height="18" fill="url(#bbholes)"/>
    <rect x="628" y="212" width="564" height="18" fill="url(#bbholes)"/>
    <rect x="628" y="246" width="564" height="92" fill="url(#bbholes)"/>
    <rect x="628" y="384" width="564" height="104" fill="url(#bbholes)"/>
    <rect x="628" y="498" width="564" height="18" fill="url(#bbholes)"/>
    <rect x="628" y="520" width="564" height="18" fill="url(#bbholes)"/>
    <rect x="628" y="562" width="564" height="18" fill="url(#bbholes)"/>
    <line x1="620" y1="190" x2="1350" y2="190" stroke="#dc2626" stroke-width="3"/>
