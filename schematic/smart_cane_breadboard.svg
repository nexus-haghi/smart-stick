<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1000" viewBox="0 0 1460 1000" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <pattern id="bbholes" width="19.33" height="21" patternUnits="userSpaceOnUse">
      <circle cx="9.67" cy="10.5" r="3.1" fill="#2b2118"/>
    </pattern>
    <style>
      .title { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #475569; }
      .ahead { font-size: 11px; font-weight: 700; fill: #e2e8f0; }
      .notehead { font-size: 16px; font-weight: 800; fill: #0f172a; }
      .notetext { font-size: 13.5px; fill: #334155; }
      .warn { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
      .part { font-size: 10px; font-weight: 700; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1460" height="1000" fill="#ffffff"/>
  <rect x="2" y="2" width="1456" height="996" fill="none" stroke="#e2e8f0" stroke-width="2" rx="16"/>

  <text x="730" y="30" text-anchor="middle" class="title">Smart Cane — Breadboard Wiring (Fritzing style)</text>
  <text x="730" y="50" text-anchor="middle" class="subtitle">3× HC-SR04 (FRONT / SIDE / TOP) &#8226; 3× vibration motors via NPN drivers &#8226; external 5V for motors, common GND everywhere</text>

  <!-- ================= ARDUINO UNO ================= -->
  <g>
    <rect x="40" y="170" width="460" height="300" rx="10" fill="#1b87c9"/>
    <rect x="40" y="170" width="460" height="300" rx="10" fill="none" stroke="#0c5d8a" stroke-width="2"/>
    <text x="270" y="265" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#ffffff;">ARDUINO UNO</text>
    <text x="270" y="290" text-anchor="middle" style="font-size:13px;fill:#d7edfa;">cane firmware &#8226; serial 9600</text>
    <rect x="40" y="300" width="26" height="52" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="46" y="312" width="14" height="28" fill="#334155"/>
    <circle cx="120" cy="420" r="22" fill="#111827"/><circle cx="120" cy="420" r="9" fill="#e2e8f0"/>
    <rect x="430" y="196" width="30" height="14" rx="3" fill="#e2e8f0" stroke="#64748b"/>
    <circle cx="455" cy="440" r="6" fill="#22c55e"/><text x="438" y="458" style="font-size:10px;fill:#d7edfa;">ON</text>
    <rect x="70" y="336" width="420" height="18" rx="4" fill="#0f172a"/>
    <g>
      <circle cx="90" cy="345" r="4.5" fill="#000"/><text x="90" y="370" text-anchor="middle" class="ahead">5V</text>
      <circle cx="130" cy="345" r="4.5" fill="#000"/><text x="130" y="370" text-anchor="middle" class="ahead">GND</text>
      <circle cx="170" cy="345" r="4.5" fill="#000"/><text x="170" y="370" text-anchor="middle" class="ahead">D2</text>
      <circle cx="210" cy="345" r="4.5" fill="#000"/><text x="210" y="370" text-anchor="middle" class="ahead">D3</text>
      <circle cx="250" cy="345" r="4.5" fill="#000"/><text x="250" y="370" text-anchor="middle" class="ahead">D4</text>
      <circle cx="290" cy="345" r="4.5" fill="#000"/><text x="290" y="370" text-anchor="middle" class="ahead">D5</text>
      <circle cx="330" cy="345" r="4.5" fill="#000"/><text x="330" y="370" text-anchor="middle" class="ahead">D6</text>
      <circle cx="370" cy="345" r="4.5" fill="#000"/><text x="370" y="370" text-anchor="middle" class="ahead">D7</text>
      <circle cx="410" cy="345" r="4.5" fill="#000"/><text x="410" y="370" text-anchor="middle" class="ahead">D9</text>
      <circle cx="440" cy="345" r="4.5" fill="#000"/><text x="440" y="370" text-anchor="middle" class="ahead">D10</text>
      <circle cx="470" cy="345" r="4.5" fill="#000"/><text x="470" y="370" text-anchor="middle" class="ahead">D11</text>
    </g>
    <text x="60" y="450" style="font-size:11px;fill:#d7edfa;">USB &#8594; PC</text>
  </g>

  <!-- ================= HC-SR04 × 3 ================= -->
  <!-- U2 FRONT -->
  <g>
    <rect x="520" y="35" width="250" height="80" rx="6" fill="#1e40af" stroke="#172f7a" stroke-width="2"/>
    <circle cx="585" cy="75" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><circle cx="585" cy="75" r="14" fill="#6b7280"/>
    <circle cx="705" cy="75" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><circle cx="705" cy="75" r="14" fill="#6b7280"/>
    <text x="645" y="58" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#ffffff;">HC-SR04 &#8226; FRONT</text>
    <g style="font-size:10px;font-weight:700;fill:#ffffff;">
      <circle cx="560" cy="120" r="4" fill="#fbbf24"/><text x="560" y="113" text-anchor="middle">VCC</text>
      <circle cx="630" cy="120" r="4" fill="#fbbf24"/><text x="630" y="113" text-anchor="middle">TRIG</text>
      <circle cx="700" cy="120" r="4" fill="#fbbf24"/><text x="700" y="113" text-anchor="middle">ECHO</text>
      <circle cx="770" cy="120" r="4" fill="#fbbf24"/><text x="770" y="113" text-anchor="middle">GND</text>
    </g>
  </g>
  <!-- U3 SIDE LEFT -->
  <g>
    <rect x="790" y="35" width="250" height="80" rx="6" fill="#1e40af" stroke="#172f7a" stroke-width="2"/>
    <circle cx="855" cy="75" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><circle cx="855" cy="75" r="14" fill="#6b7280"/>
    <circle cx="975" cy="75" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><circle cx="975" cy="75" r="14" fill="#6b7280"/>
    <text x="915" y="58" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#ffffff;">HC-SR04 &#8226; SIDE (LEFT)</text>
    <g style="font-size:10px;font-weight:700;fill:#ffffff;">
      <circle cx="830" cy="120" r="4" fill="#fbbf24"/><text x="830" y="113" text-anchor="middle">VCC</text>
      <circle cx="900" cy="120" r="4" fill="#fbbf24"/><text x="900" y="113" text-anchor="middle">TRIG</text>
      <circle cx="970" cy="120" r="4" fill="#fbbf24"/><text x="970" y="113" text-anchor="middle">ECHO</text>
      <circle cx="1040" cy="120" r="4" fill="#fbbf24"/><text x="1040" y="113" text-anchor="middle">GND</text>
    </g>
  </g>
  <!-- U4 TOP -->
  <g>
    <rect x="1060" y="35" width="250" height="80" rx="6" fill="#1e40af" stroke="#172f7a" stroke-width="2"/>
    <circle cx="1125" cy="75" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><circle cx="1125" cy="75" r="14" fill="#6b7280"/>
    <circle cx="1245" cy="75" r="24" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/><circle cx="1245" cy="75" r="14" fill="#6b7280"/>
    <text x="1185" y="58" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#ffffff;">HC-SR04 &#8226; TOP</text>
    <g style="font-size:10px;font-weight:700;fill:#ffffff;">
