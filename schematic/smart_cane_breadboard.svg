    <line x1="620" y1="562" x2="1200" y2="562" stroke="#dc2626" stroke-width="3"/>
    <line x1="620" y1="584" x2="1200" y2="584" stroke="#2563eb" stroke-width="3"/>
    <text x="622" y="207" style="font-size:13px;font-weight:800;fill:#dc2626;">+</text>
    <text x="622" y="231" style="font-size:13px;font-weight:800;fill:#2563eb;">−</text>
    <text x="622" y="579" style="font-size:13px;font-weight:800;fill:#2563eb;">−</text>
    <text x="622" y="555" style="font-size:13px;font-weight:800;fill:#dc2626;">+</text>
  </g>

  <!-- ================= DRIVER ZONES (R + Q + D) ================= -->
  <!-- Zone 1 (FRONT) column 690 -->
  <g>
    <text x="690" y="292" text-anchor="middle" class="part">R1 1kΩ</text>
    <rect x="682" y="302" width="16" height="34" rx="4" fill="#e7c07e" stroke="#b45309"/>
    <line x1="688" y1="302" x2="688" y2="318" stroke="#8b4513" stroke-width="4"/><line x1="688" y1="319" x2="688" y2="331" stroke="#000" stroke-width="3"/><line x1="692" y1="302" x2="692" y2="331" stroke="#dc2626" stroke-width="3"/>
    <line x1="690" y1="336" x2="690" y2="412" stroke="#94a3b8" stroke-width="2"/>
    <rect x="664" y="368" width="52" height="48" rx="6" fill="#2e7d32" stroke="#14532d"/>
    <text x="690" y="396" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#ffffff;">Q1</text>
    <circle cx="690" cy="412" r="3.5" fill="#14532d"/><text x="690" y="432" text-anchor="middle" class="part">B</text>
    <circle cx="708" cy="412" r="3.5" fill="#14532d"/><text x="708" y="432" text-anchor="middle" class="part">E</text>
    <circle cx="726" cy="412" r="3.5" fill="#14532d"/><text x="726" y="432" text-anchor="middle" class="part">C</text>
  </g>
  <!-- Zone 2 (SIDE) column 890 -->
  <g>
    <text x="890" y="292" text-anchor="middle" class="part">R2 1kΩ</text>
    <rect x="882" y="302" width="16" height="34" rx="4" fill="#e7c07e" stroke="#b45309"/>
    <line x1="888" y1="302" x2="888" y2="318" stroke="#8b4513" stroke-width="4"/><line x1="888" y1="319" x2="888" y2="331" stroke="#000" stroke-width="3"/><line x1="892" y1="302" x2="892" y2="331" stroke="#dc2626" stroke-width="3"/>
    <line x1="890" y1="336" x2="890" y2="412" stroke="#94a3b8" stroke-width="2"/>
    <rect x="864" y="368" width="52" height="48" rx="6" fill="#2e7d32" stroke="#14532d"/>
    <text x="890" y="396" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#ffffff;">Q2</text>
    <circle cx="890" cy="412" r="3.5" fill="#14532d"/><text x="890" y="432" text-anchor="middle" class="part">B</text>
    <circle cx="908" cy="412" r="3.5" fill="#14532d"/><text x="908" y="432" text-anchor="middle" class="part">E</text>
    <circle cx="926" cy="412" r="3.5" fill="#14532d"/><text x="926" y="432" text-anchor="middle" class="part">C</text>
  </g>
  <!-- Zone 3 (TOP) column 1090 -->
  <g>
    <text x="1090" y="292" text-anchor="middle" class="part">R3 1kΩ</text>
    <rect x="1082" y="302" width="16" height="34" rx="4" fill="#e7c07e" stroke="#b45309"/>
    <line x1="1088" y1="302" x2="1088" y2="318" stroke="#8b4513" stroke-width="4"/><line x1="1088" y1="319" x2="1088" y2="331" stroke="#000" stroke-width="3"/><line x1="1092" y1="302" x2="1092" y2="331" stroke="#dc2626" stroke-width="3"/>
    <line x1="1090" y1="336" x2="1090" y2="412" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1064" y="368" width="52" height="48" rx="6" fill="#2e7d32" stroke="#14532d"/>
    <text x="1090" y="396" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#ffffff;">Q3</text>
    <circle cx="1090" cy="412" r="3.5" fill="#14532d"/><text x="1090" y="432" text-anchor="middle" class="part">B</text>
    <circle cx="1108" cy="412" r="3.5" fill="#14532d"/><text x="1108" y="432" text-anchor="middle" class="part">E</text>
    <circle cx="1126" cy="412" r="3.5" fill="#14532d"/><text x="1126" y="432" text-anchor="middle" class="part">C</text>
  </g>

  <!-- ================= VIBRATION MOTORS ================= -->
  <g>
    <!-- M1 -->
    <circle cx="1290" cy="300" r="30" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <rect x="1278" y="290" width="24" height="20" rx="3" fill="#0f172a"/>
    <text x="1290" y="352" text-anchor="middle" class="part">M1 · FRONT</text>
    <text x="1290" y="364" text-anchor="middle" style="font-size:9px;fill:#94a3b8;">vibration motor</text>
    <circle cx="1290" cy="272" r="4" fill="#dc2626"/>
    <circle cx="1290" cy="328" r="4" fill="#fb923c"/>
    <!-- M2 -->
    <circle cx="1290" cy="452" r="30" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <rect x="1278" y="442" width="24" height="20" rx="3" fill="#0f172a"/>
    <text x="1290" y="504" text-anchor="middle" class="part">M2 · SIDE (LEFT)</text>
    <text x="1290" y="516" text-anchor="middle" style="font-size:9px;fill:#94a3b8;">vibration motor</text>
    <circle cx="1290" cy="424" r="4" fill="#dc2626"/>
    <circle cx="1290" cy="480" r="4" fill="#fb923c"/>
    <!-- M3 -->
    <circle cx="1290" cy="604" r="30" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <rect x="1278" y="594" width="24" height="20" rx="3" fill="#0f172a"/>
    <text x="1290" y="656" text-anchor="middle" class="part">M3 · TOP</text>
    <text x="1290" y="668" text-anchor="middle" style="font-size:9px;fill:#94a3b8;">vibration motor</text>
    <circle cx="1290" cy="576" r="4" fill="#dc2626"/>
    <circle cx="1290" cy="632" r="4" fill="#fb923c"/>
  </g>

  <!-- ================= EXTERNAL 5V SUPPLY ================= -->
  <g>
    <rect x="1250" y="720" width="250" height="110" rx="10" fill="#111827"/>
    <text x="1375" y="762" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#ffffff;">5V &#9147; 1A</text>
    <text x="1375" y="784" text-anchor="middle" style="font-size:12px;fill:#9ca3af;">EXTERNAL (motors)</text>
    <circle cx="1280" cy="720" r="6" fill="#ef4444"/>
    <circle cx="1450" cy="720" r="6" fill="#000000" stroke="#9ca3af" stroke-width="2"/>
    <text x="1280" y="712" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#fecaca;">+</text>
    <text x="1450" y="712" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#9ca3af;">−</text>
  </g>

  <!-- ================= WIRES ================= -->
  <g fill="none" stroke-linecap="round" stroke-width="4">
    <!-- Arduino power feeds -->
    <path d="M90,345 L90,150 L620,150 L620,190" stroke="#ef4444"/>
    <path d="M130,345 L130,146 L645,146 L645,238" stroke="#1f2937"/>
    <!-- rail coupling top to bottom (left edge) -->
    <path d="M635,190 L635,562" stroke="#ef4444"/>
    <path d="M631,238 L631,584" stroke="#1f2937"/>
    <!-- sensor VCC/GND -->
    <path d="M560,120 L560,190" stroke="#ef4444"/>
    <path d="M770,120 L770,238" stroke="#1f2937"/>
    <path d="M830,120 L830,190" stroke="#ef4444"/>
    <path d="M1040,120 L1040,238" stroke="#1f2937"/>
    <path d="M1100,120 L1100,190" stroke="#ef4444"/>
    <path d="M1310,120 L1310,238" stroke="#1f2937"/>
    <!-- TRIG / ECHO -->
    <path d="M630,120 L630,155 L170,155 L170,345" stroke="#eab308"/>
    <path d="M700,120 L700,160 L210,160 L210,345" stroke="#22c55e"/>
    <path d="M900,120 L900,165 L250,165 L250,345" stroke="#eab308"/>
    <path d="M970,120 L970,170 L290,170 L290,345" stroke="#22c55e"/>
    <path d="M1170,120 L1170,175 L330,175 L330,345" stroke="#eab308"/>
    <path d="M1240,120 L1240,180 L370,180 L370,345" stroke="#22c55e"/>
    <!-- PWM D9/D10/D11 → resistor tops -->
    <path d="M410,345 L410,480 L690,480 L690,300" stroke="#a855f7"/>
    <path d="M440,345 L440,515 L890,515 L890,300" stroke="#a855f7"/>
    <path d="M470,345 L470,545 L1090,545 L1090,300" stroke="#a855f7"/>
    <!-- emitters → bottom (−) rail -->
    <path d="M708,414 L708,584" stroke="#1f2937"/>
    <path d="M908,414 L908,584" stroke="#1f2937"/>
    <path d="M1108,414 L1108,584" stroke="#1f2937"/>
    <!-- collectors → motor lead1 -->
    <path d="M726,414 L726,428 L1290,428 L1290,328" stroke="#fb923c"/>
    <path d="M926,414 L926,455 L1290,455 L1290,480" stroke="#fb923c"/>
    <path d="M1126,414 L1126,505 L1290,505 L1290,632" stroke="#fb923c"/>
    <!-- motor lead2 → + rail via flyback diode -->
    <path d="M1290,272 L1290,190" stroke="#ef4444"/>
    <path d="M1290,424 L1330,424 L1330,190" stroke="#ef4444"/>
    <path d="M1290,576 L1370,576 L1370,190" stroke="#ef4444"/>
    <!-- external supply feeds bottom rails -->
    <path d="M1280,720 L1280,600 L1200,600 L1200,562" stroke="#ef4444"/>
    <path d="M1450,720 L1450,604 L1190,604 L1190,584" stroke="#1f2937"/>
  </g>

  <!-- ================= FLYBACK DIODES ================= -->
  <g>
    <path d="M1290,245 L1276,258 L1304,258 Z" fill="#e65100" stroke="#e65100" stroke-width="1"/>
    <line x1="1300" y1="251" x2="1300" y2="265" stroke="#e65100" stroke-width="3"/>
    <path d="M1330,397 L1316,410 L1344,410 Z" fill="#e65100" stroke="#e65100" stroke-width="1"/>
    <line x1="1340" y1="403" x2="1340" y2="417" stroke="#e65100" stroke-width="3"/>
    <path d="M1370,549 L1356,562 L1384,562 Z" fill="#e65100" stroke="#e65100" stroke-width="1"/>
    <line x1="1380" y1="555" x2="1380" y2="569" stroke="#e65100" stroke-width="3"/>
    <text x="1312" y="242" class="part">D1</text>
    <text x="1352" y="394" class="part">D2</text>
    <text x="1392" y="546" class="part">D3</text>
  </g>

  <!-- ================= NOTES ================= -->
  <rect x="40" y="840" width="1380" height="120" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="65" y="868" class="notehead">Parts on the breadboard</text>
  <text x="65" y="890" class="notetext">Each motor driver zone: 1 kΩ base resistor + NPN transistor (2N2222 / BC547) + flyback diode across the motor</text>
  <text x="65" y="912" class="notetext">Sensors: VCC → + rail, GND → − rail, TRIG → D2/D4/D6, ECHO → D3/D5/D7 (FRONT / SIDE / TOP)</text>
  <text x="65" y="934" class="notetext">Motors: lead1 (orange) → transistor collector, lead2 (red) → +5 V through the flyback diode</text>
  <text x="65" y="952" class="warn">Power rule: motors NEVER from the Arduino 5V pin — external 5V (≥1A) with GND tied to Arduino GND. All rails share one common ground.</text>
  <text x="760" y="890" class="notehead">Wire colors in this diagram</text>
  <g style="font-size:13.5px;fill:#334155;">
    <line x1="760" y1="906" x2="790" y2="906" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/><text x="800" y="911">5V / motor lead2 (red)</text>
    <line x1="1040" y1="906" x2="1070" y2="906" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><text x="1080" y="911">GND (common ground)</text>
    <line x1="760" y1="928" x2="790" y2="928" stroke="#eab308" stroke-width="5" stroke-linecap="round"/><text x="800" y="933">TRIG (yellow)</text>
    <line x1="1040" y1="928" x2="1070" y2="928" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/><text x="1080" y="933">ECHO (green)</text>
    <line x1="760" y1="950" x2="790" y2="950" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/><text x="800" y="955">D9/D10/D11 PWM</text>
    <line x1="1040" y1="950" x2="1070" y2="950" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/><text x="1080" y="955">collector → motor lead1</text>
  </g>
</svg>
